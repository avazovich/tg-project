<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Foydami">
  <defs>
    <linearGradient id="foydamiStay" x1="14" y1="32" x2="56" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3629B7"/>
      <stop offset="1" stop-color="#1573FF"/>
    </linearGradient>
    <linearGradient id="foydamiChurn" x1="14" y1="32" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9C94CF"/>
      <stop offset="1" stop-color="#C6C1E0"/>
    </linearGradient>
  </defs>

  <!-- The audience that churns: same origin, drops away and levels off low. -->
  <path d="M14 32 C22 32, 22 50, 32 50 L47 50"
        stroke="url(#foydamiChurn)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The audience that stays: climbs, then holds. -->
  <path d="M14 32 C22 32, 22 14, 32 14 L54 14"
        stroke="url(#foydamiStay)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shared origin — one acquisition, two outcomes. -->
  <circle cx="14" cy="32" r="6.5" fill="#3629B7"/>
</svg>
